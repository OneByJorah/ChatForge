name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: TypeScript Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test
      # This Worker has NO runtime npm dependencies (dependencies: {}), so audit the
      # production tree — auditing dev tooling here can never pass: the upstream
      # @cloudflare/vitest-pool-workers advisory range (>=0.8.31) flags every
      # current release, including latest 0.23.0.
      - run: npm audit --omit=dev --audit-level=high
