version: "3.8"

services:
  chatforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatforge
    ports:
      - "8787:8787"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8787/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
